    <script>
      // Gracefully prevent unhandled promise rejections specifically triggered when
      // Vite dev server WebSocket connections are terminated by preview reverse proxies.
      // All other application errors, network errors, and rejections are preserved.
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack)) || String(reason || '');
        if (
          msg.includes('WebSocket closed without opened') ||
          msg.includes('failed to connect to websocket')
        ) {
          event.preventDefault();
        }
      });
    </script>
